services:
  - type: web
    name: syro-telegram-bot
    env: python
    region: oregon
    plan: free
    branch: siddhant_dev
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PORT
        value: 8000
    healthCheckPath: /health
