services:
  - type: web
    name: syro-telegram-bot
    env: docker                # Use Docker, not python, since you have a Dockerfile
    region: oregon
    plan: free
    branch: siddhant_dev
    dockerfilePath: ./Dockerfile  # Points to your Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: TELEGRAM_TOKEN
        fromDatabase: true       # Pull from Render environment variables
      - key: GEMINI_API_KEY
        fromDatabase: true
      - key: MONGODB_URL
        fromDatabase: true
      - key: GOOGLE_PLACES_API_KEY
        fromDatabase: true
      - key: HUGGINGFACE_TOKEN
        fromDatabase: true
      - key: SPOTIFY_CLIENT_ID
        fromDatabase: true
      - key: SPOTIFY_CLIENT_SECRET
        fromDatabase: true
      - key: UPSTASH_REDIS_REST_URL
        fromDatabase: true
      - key: UPSTASH_REDIS_REST_TOKEN
        fromDatabase: true
    healthCheckPath: /health
